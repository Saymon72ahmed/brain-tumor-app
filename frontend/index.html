<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRI Diagnostics Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center py-10 px-4">

    <div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-full max-w-4xl border border-gray-700">
        <h1 class="text-3xl font-bold mb-2 text-center text-blue-400">NeuroScan AI</h1>
        <p class="text-gray-400 text-center mb-6 text-sm">Diagnostic Engine: Single & Batch Processing</p>

        <div class="flex justify-center mb-6 space-x-4 border-b border-gray-700 pb-4">
            <button onclick="setMode('single')" id="tab_single" class="px-4 py-2 font-bold text-blue-400 border-b-2 border-blue-400">Single Scan</button>
            <button onclick="setMode('batch')" id="tab_batch" class="px-4 py-2 font-bold text-gray-500 hover:text-gray-300">Batch Processing</button>
        </div>

        <div class="mb-6 flex justify-center">
            <input class="block w-full max-w-lg text-sm text-gray-400 border border-gray-600 rounded-lg cursor-pointer bg-gray-700 p-2" id="file_input" type="file" accept="image/*">
        </div>

        <button onclick="processImages()" class="w-full max-w-lg mx-auto block bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200" id="analyze_btn">
            Analyze Image(s)
        </button>

        <div id="single_result_box" class="mt-8 hidden flex-col items-center max-w-lg mx-auto">
            <div class="p-4 rounded-lg bg-gray-700 text-center w-full mb-4 border border-gray-600">
                <p class="text-sm text-gray-300 uppercase tracking-widest">Diagnosis</p>
                <p id="single_diagnosis" class="text-3xl font-bold mt-1"></p>
                <p id="single_confidence" class="text-sm mt-1 text-gray-400"></p>
                <div class="mt-4 border border-gray-600 rounded p-3 bg-gray-800">
                    <img id="single_heatmap" class="w-full rounded shadow-lg" src="" alt="Grad-CAM">
                </div>
            </div>
            <button onclick="generateSinglePDF()" class="w-full bg-green-600 hover:bg-green-700 font-bold py-3 px-4 rounded-lg">Download Single Report</button>
        </div>

        <div id="batch_result_box" class="mt-8 hidden w-full">
            <div class="overflow-x-auto rounded-lg border border-gray-700">
                <table class="w-full text-left text-sm text-gray-400">
                    <thead class="bg-gray-700 text-gray-300 uppercase">
                        <tr>
                            <th class="px-4 py-3">Filename</th>
                            <th class="px-4 py-3">Diagnosis</th>
                            <th class="px-4 py-3">Confidence</th>
                            <th class="px-4 py-3">Heatmap</th>
                        </tr>
                    </thead>
                    <tbody id="batch_table_body" class="divide-y divide-gray-700">
                        </tbody>
                </table>
            </div>
            <button onclick="generateBatchPDF()" class="mt-6 w-full max-w-lg mx-auto block bg-green-600 hover:bg-green-700 font-bold py-3 px-4 rounded-lg">Download Batch Report</button>
        </div>
    </div>

    <script>
        let currentMode = 'single';
        let singleData = {};
        let batchData = [];

        // Tab Switch Logic
        function setMode(mode) {
            currentMode = mode;
            const input = document.getElementById('file_input');
            const btn = document.getElementById('analyze_btn');
            
            document.getElementById('single_result_box').classList.add('hidden');
            document.getElementById('batch_result_box').classList.add('hidden');

            if (mode === 'batch') {
                input.multiple = true;
                btn.innerText = 'Analyze Batch Scans';
                document.getElementById('tab_batch').className = "px-4 py-2 font-bold text-blue-400 border-b-2 border-blue-400";
                document.getElementById('tab_single').className = "px-4 py-2 font-bold text-gray-500 hover:text-gray-300";
            } else {
                input.multiple = false;
                btn.innerText = 'Analyze Image';
                document.getElementById('tab_single').className = "px-4 py-2 font-bold text-blue-400 border-b-2 border-blue-400";
                document.getElementById('tab_batch').className = "px-4 py-2 font-bold text-gray-500 hover:text-gray-300";
            }
        }

        async function processImages() {
            const input = document.getElementById('file_input');
            const btn = document.getElementById('analyze_btn');
            
            if (!input.files.length) return alert('Upload at least one MRI scan.');

            btn.innerText = 'Processing via ResNet-50...';
            btn.disabled = true;

            const formData = new FormData();
            for (let i = 0; i < input.files.length; i++) {
                formData.append(currentMode === 'batch' ? 'files' : 'file', input.files[i]);
            }

            try {
                const endpoint = currentMode === 'batch' ? '/predict/batch' : '/predict';
                const response = await fetch(endpoint, { method: 'POST', body: formData });
                const data = await response.json();

                if (currentMode === 'single') {
                    singleData = data;
                    document.getElementById('single_diagnosis').innerText = data.diagnosis;
                    document.getElementById('single_diagnosis').className = `text-3xl font-bold mt-1 ${data.diagnosis === 'NOTUMOR' ? 'text-green-500' : 'text-red-500'}`;
                    document.getElementById('single_confidence').innerText = `Confidence: ${data.confidence}%`;
                    document.getElementById('single_heatmap').src = `data:image/jpeg;base64,${data.heatmap}`;
                    document.getElementById('single_result_box').classList.remove('hidden');
                } else {
                    batchData = data.batch_results;
                    const tbody = document.getElementById('batch_table_body');
                    tbody.innerHTML = '';
                    batchData.forEach(item => {
                        const colorClass = item.diagnosis === 'NOTUMOR' ? 'text-green-400' : 'text-red-400 font-bold';
                        tbody.innerHTML += `
                            <tr class="bg-gray-800 hover:bg-gray-750">
                                <td class="px-4 py-3 font-medium text-white">${item.filename}</td>
                                <td class="px-4 py-3 ${colorClass}">${item.diagnosis}</td>
                                <td class="px-4 py-3">${item.confidence}%</td>
                                <td class="px-4 py-3"><img src="data:image/jpeg;base64,${item.heatmap}" class="h-12 w-12 rounded border border-gray-600"></td>
                            </tr>
                        `;
                    });
                    document.getElementById('batch_result_box').classList.remove('hidden');
                }
            } catch (e) {
                alert('API Error: Connection failed.');
            } finally {
                btn.innerText = currentMode === 'batch' ? 'Analyze Batch Scans' : 'Analyze Image';
                btn.disabled = false;
            }
        }

        // Single PDF Export
        function generateSinglePDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(31, 41, 55); doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(18);
            doc.text("NEUROSCAN AI - SINGLE REPORT", 105, 20, null, null, "center");
            
            doc.setTextColor(0, 0, 0); doc.setFontSize(14);
            doc.text(`File: ${singleData.filename || 'MRI_Scan'}`, 20, 50);
            doc.text(`Diagnosis: ${singleData.diagnosis}`, 20, 60);
            doc.text(`Confidence: ${singleData.confidence}%`, 20, 70);
            
            doc.addImage(`data:image/jpeg;base64,${singleData.heatmap}`, 'JPEG', 20, 85, 100, 100);
            doc.save(`NeuroScan_${singleData.diagnosis}.pdf`);
        }

        // Batch PDF Export
        function generateBatchPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.setFillColor(31, 41, 55); doc.rect(0, 0, 210, 30, 'F');
            doc.setTextColor(255, 255, 255); doc.setFontSize(18);
            doc.text("NEUROSCAN AI - BATCH SUMMARY", 105, 20, null, null, "center");

            doc.setTextColor(0, 0, 0); doc.setFontSize(10);
            let yPos = 45;
            
            // Header
            doc.setFont("helvetica", "bold");
            doc.text("FILENAME", 20, yPos);
            doc.text("DIAGNOSIS", 100, yPos);
            doc.text("CONFIDENCE", 150, yPos);
            yPos += 10;
            doc.line(20, yPos - 5, 190, yPos - 5);

            // Data Loop
            doc.setFont("helvetica", "normal");
            batchData.forEach((item, index) => {
                if (yPos > 270) { doc.addPage(); yPos = 20; }
                if(item.diagnosis !== 'NOTUMOR') { doc.setTextColor(220, 38, 38); } else { doc.setTextColor(0, 128, 0); }
                
                doc.text(item.filename.substring(0, 30), 20, yPos);
                doc.text(item.diagnosis, 100, yPos);
                doc.text(`${item.confidence}%`, 150, yPos);
                doc.setTextColor(0, 0, 0);
                yPos += 10;
            });

            doc.save(`NeuroScan_Batch_${new Date().getTime()}.pdf`);
        }
    </script>
</body>
</html>
